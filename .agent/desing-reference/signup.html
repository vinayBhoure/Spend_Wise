</div>
</div>
<div class="space-y-2">
<label class="font-headline text-[11px] font-bold uppercase tracking-[0.15em] text-slate-500 ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-[#161d2f] border-none rounded-xl py-4 pl-12 pr-12 text-on-surface focus:ring-2 focus:ring-primary/50 placeholder:text-slate-600 transition-all font-medium" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="font-headline text-[11px] font-bold uppercase tracking-[0.15em] text-slate-500 ml-1">Confirm Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-[#161d2f] border-none rounded-xl py-4 pl-12 pr-4 text-on-surface focus:ring-2 focus:ring-primary/50 placeholder:text-slate-600 transition-all font-medium" placeholder="••••••••" type="password"/>

</div>
<button class="w-full bg-primary text-[#0f2321] font-extrabold py-4 rounded-xl shadow-lg shadow-primary/10 active:scale-[0.98] transition-all hover:brightness-110 mt-4 uppercase tracking-widest text-sm">
