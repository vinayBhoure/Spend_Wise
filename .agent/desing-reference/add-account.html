<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendWise - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e6cb",
                        "background-dark": "#0A0F1E",
                        "card-dark": "#151B2D",
                        "input-dark": "#1E263B",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "sans": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0A0F1E;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
<!-- Status Bar Spacer (iOS Style) -->
<div class="w-full max-w-md h-8"></div>
<!-- Main Container Card -->
<div class="w-full max-w-[400px] bg-card-dark rounded-xl shadow-2xl overflow-hidden border border-slate-800 flex flex-col">
<!-- Header -->
<div class="flex items-center justify-between p-6 pb-2">
<button class="text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">chevron_left</span>
</button>
<h2 class="text-lg font-bold tracking-tight">Add New Account</h2>
<div class="w-6"></div> <!-- Spacer for symmetry -->
</div>
<div class="p-6 pt-4 flex flex-col gap-8">
<!-- Abstract Hero Pattern (Emerald Zenith Style) -->
<div class="relative h-32 w-full rounded-lg overflow-hidden bg-primary/5 border border-primary/10">
<div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_50%_50%,#00e6cb,transparent_70%)]"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl opacity-80">account_balance_wallet</span>
</div>
</div>
<!-- Initial Balance Large Field -->
<div class="flex flex-col items-center gap-2">
<p class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Initial Balance</p>
<div class="flex items-baseline gap-2">
<span class="text-2xl font-bold text-primary">$</span>
<input class="bg-transparent border-none p-0 text-5xl font-extrabold text-center focus:ring-0 w-full max-w-[200px] text-white placeholder-slate-700" placeholder="0.00" type="text" value="0.00"/>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Account Name -->
<div class="flex flex-col gap-2">
<label class="text-xs font-semibold text-slate-400 ml-1">Account Name</label>
<div class="relative group">
<input class="w-full h-12 px-4 rounded-lg bg-input-dark border-2 border-primary/20 focus:border-primary text-white focus:outline-none transition-all" placeholder="e.g. My Pocket Money" type="text" value="Main Savings"/>
<div class="absolute right-3 top-3 text-slate-500 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">edit</span>
</div>
</div>
</div>
<!-- Account Type Selector -->
<div class="flex flex-col gap-3">
<label class="text-xs font-semibold text-slate-400 ml-1">Account Type</label>
<div class="grid grid-cols-2 gap-3">
<!-- Type: Bank (Selected) -->
<button class="flex items-center gap-3 p-3 rounded-lg border-2 border-primary bg-primary/10 text-primary transition-all">
<span class="material-symbols-outlined">account_balance</span>
<span class="text-sm font-bold">Bank</span>
</button>
<!-- Type: Cash -->
<button class="flex items-center gap-3 p-3 rounded-lg border-2 border-transparent bg-input-dark text-slate-400 hover:border-slate-700 transition-all">
<span class="material-symbols-outlined">payments</span>
<span class="text-sm font-bold">Cash</span>
</button>
<!-- Type: UPI -->
<button class="flex items-center gap-3 p-3 rounded-lg border-2 border-transparent bg-input-dark text-slate-400 hover:border-slate-700 transition-all">
<span class="material-symbols-outlined">qr_code_2</span>
<span class="text-sm font-bold">UPI</span>
</button>
<!-- Type: Credit Card -->
<button class="flex items-center gap-3 p-3 rounded-lg border-2 border-transparent bg-input-dark text-slate-400 hover:border-slate-700 transition-all">
<span class="material-symbols-outlined">credit_card</span>
<span class="text-sm font-bold">Credit Card</span>
</button>
</div>
</div>
</div>
<!-- CTA Button -->
<button class="w-full h-14 mt-4 bg-primary text-[#0A0F1E] font-extrabold text-lg rounded-lg shadow-lg shadow-primary/10 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Create Account</span>
<span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</div>
<!-- Safe Area Indicator (iOS Style) -->
<div class="p-4 flex justify-center opacity-10">
<div class="w-32 h-1 bg-slate-100 rounded-full"></div>
</div>
</div>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-20%] right-[-10%] w-[60%] h-[60%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[60%] h-[60%] bg-primary/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
