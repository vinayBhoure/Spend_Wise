<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendWise Edit Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e6cb",
                        "destructive": "#FF5A7E",
                        "background-light": "#f5f8f8",
                        "background-dark": "#091412",
                        "surface-dark": "#121f1d",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-[480px] mx-auto overflow-x-hidden">
<header class="flex items-center p-4 pb-2 justify-between">
<div class="flex items-center gap-4">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h1 class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight">Edit Account</h1>
</div>
<button class="text-primary font-bold text-base px-2">Save</button>
</header>
<main class="flex-1 px-4 py-6 flex flex-col gap-8">
<!-- Details Section -->
<section class="flex flex-col gap-4">
<h2 class="text-slate-500 dark:text-slate-500 text-xs font-bold uppercase tracking-widest px-1">Details</h2>
<div class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-white/5 overflow-hidden">
<div class="flex flex-col gap-1.5 p-4 border-b border-slate-200 dark:border-white/5">
<label class="text-slate-500 dark:text-slate-500 text-[10px] font-bold uppercase tracking-wider">Account Name</label>
<input class="bg-transparent border-none p-0 focus:ring-0 text-slate-900 dark:text-slate-100 text-lg font-semibold placeholder:text-slate-400" type="text" value="Main Savings"/>
</div>
<div class="flex flex-col gap-1.5 p-4 border-b border-slate-200 dark:border-white/5">
<label class="text-slate-500 dark:text-slate-500 text-[10px] font-bold uppercase tracking-wider">Initial Balance</label>
<div class="flex items-center gap-2">
<span class="text-slate-400 dark:text-slate-500 text-lg font-semibold">$</span>
<input class="bg-transparent border-none p-0 focus:ring-0 text-slate-900 dark:text-slate-100 text-lg font-semibold placeholder:text-slate-400 w-full" type="number" value="12500.00"/>
</div>
</div>
<div class="flex flex-col gap-1.5 p-4">
<label class="text-slate-500 dark:text-slate-500 text-[10px] font-bold uppercase tracking-wider">Account Type</label>
<div class="relative group cursor-pointer">
<select class="appearance-none w-full bg-transparent border-none p-0 focus:ring-0 text-slate-900 dark:text-slate-100 text-lg font-semibold pr-10 cursor-pointer">
<option value="upi">UPI</option>
<option selected="" value="savings">Savings Account</option>
<option value="credit">Credit Card</option>
<option value="cash">Cash</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 pointer-events-none">unfold_more</span>
</div>
</div>
</div>
</section>
<!-- Preferences Section -->
<section class="flex flex-col gap-4">
<h2 class="text-slate-500 dark:text-slate-500 text-xs font-bold uppercase tracking-widest px-1">Preferences</h2>
<div class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-slate-200 dark:border-white/5 p-4">
<div class="flex items-start justify-between gap-4">
<div class="flex flex-col gap-1">
<span class="text-slate-900 dark:text-slate-100 text-base font-bold">Exclude from Transactions</span>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-snug">Transactions from this account won't affect total balance calculation.</p>
</div>
<label class="relative inline-flex items-center cursor-pointer mt-1">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-300 dark:bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Danger Zone Section -->
<section class="flex flex-col gap-4">
<h2 class="text-slate-500 dark:text-slate-500 text-xs font-bold uppercase tracking-widest px-1">Danger Zone</h2>
<div class="flex flex-col gap-3">
<!-- Archive Button (Secondary standard) -->
<button class="flex items-center justify-between w-full p-4 bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5 rounded-xl transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-500">inventory_2</span>
<span class="text-slate-700 dark:text-slate-200 font-semibold text-base">Archive Account</span>
</div>
<span class="material-symbols-outlined text-slate-400 text-xl">chevron_right</span>
</button>
<!-- Delete Button (System Destructive Style) -->
<button class="flex items-center justify-between w-full p-4 bg-destructive/10 dark:bg-destructive/10 border border-destructive/20 hover:bg-destructive/20 rounded-xl transition-all group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-destructive">delete</span>
<span class="text-destructive font-bold text-base">Delete Account</span>
</div>
<div class="bg-destructive/20 px-2 py-0.5 rounded text-[10px] font-bold text-destructive uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Permanent</div>
</button>
</div>
<p class="text-center text-slate-500 dark:text-slate-600 text-xs px-8 mt-2">
                    Deleting an account will permanently remove all associated transaction data and history.
                </p>
</section>
</main>
<!-- Bottom spacing for mobile without navigation -->
<div class="h-8"></div>
</div>
</body></html>
