<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendWise Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e6cb",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0a0f1e",
                        "surface": "#111827",
                        "border-subtle": "#1f2937"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0a0f1e;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .segmented-control {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input:focus {
            box-shadow: 0 0 0 2px rgba(0, 230, 203, 0.2);
        }
    </style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen flex flex-col items-center justify-start font-body antialiased">
<div class="w-full max-w-[430px] min-h-screen flex flex-col px-8 py-16 relative overflow-hidden">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-12">
<div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mb-6 ring-1 ring-primary/20">
<span class="material-symbols-outlined text-primary text-4xl font-light">payments</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-white mb-2">SpendWise</h1>
<p class="text-slate-400 text-sm font-medium">Master your finances with ease</p>
</div>
<!-- Segmented Control (Tab Switcher) -->
<div class="segmented-control p-1 rounded-xl flex mb-10 w-full">
<button class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-primary text-background-dark shadow-sm transition-all duration-200">
                Login
            </button>
<button class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition-all duration-200">
                Sign Up
            </button>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-[20px] font-light">mail</span>
<input class="w-full bg-surface border border-border-subtle rounded-lg py-4 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-primary transition-all" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-[20px] font-light">lock</span>
<input class="w-full bg-surface border border-border-subtle rounded-lg py-4 pl-12 pr-12 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-primary transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
<span class="material-symbols-outlined text-[20px] font-light">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary hover:bg-[#00d1b8] text-background-dark font-bold py-4 rounded-lg shadow-lg shadow-primary/10 transition-all active:scale-[0.98] mt-4">
                Login
            </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 my-12">
<div class="h-px bg-border-subtle flex-1"></div>
<span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Or continue with</span>
<div class="h-px bg-border-subtle flex-1"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="glass-effect py-3.5 rounded-lg flex items-center justify-center gap-3 hover:bg-white/5 transition-all">
<svg fill="none" height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.26 1.07-3.71 1.07-2.85 0-5.27-1.92-6.13-4.51H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.87 14.13c-.22-.67-.35-1.39-.35-2.13s.13-1.46.35-2.13V7.03H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.97l3.69-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.03l3.69 2.84c.86-2.59 3.28-4.51 6.13-4.51z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-slate-200">Google</span>
</button>
<button class="glass-effect py-3.5 rounded-lg flex items-center justify-center gap-3 hover:bg-white/5 transition-all">
<svg fill="white" height="18" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.96.4-2.16.84-3.52.84-3.23 0-5.59-2.31-5.59-5.74 0-3.32 2.31-5.69 5.54-5.69 1.25 0 2.37.36 3.14.77l.21.11.83-1.63-.2-.11a5.61 5.61 0 0 0-4.04-1.14c-4.47 0-7.79 3.23-7.79 7.69 0 4.63 3.43 7.74 7.9 7.74 1.71 0 3.3-.59 4.31-1l.2-.1-.85-1.57-.14.07z"></path>
<path d="M12.11 6.84a3.15 3.15 0 0 1 2.27-2.67l.11-.03-.23-.84-.11.03a4.05 4.05 0 0 0-2.94 3.42l-.01.12.89.09.02-.12z"></path>
</svg>
<span class="text-sm font-semibold text-slate-200">Apple</span>
</button>
</div>
</div>
<!-- Decorative background elements -->
<div class="fixed top-[-15%] left-[-15%] w-[60%] h-[60%] bg-primary/10 blur-[120px] rounded-full pointer-events-none opacity-50"></div>
<div class="fixed bottom-[-15%] right-[-15%] w-[60%] h-[60%] bg-primary/5 blur-[120px] rounded-full pointer-events-none opacity-30"></div>
</body></html>
