<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendWise - Add Transaction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e6cb",
                        "background-dark": "#0A0F1E",
                        "surface-dark": "#161B2E",
                        "slate-850": "#1e293b",
                    },
                    fontFamily: {
                        "sans": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Manrope', sans-serif;
                -webkit-tap-highlight-color: transparent;
                @apply bg-background-dark text-slate-100 min-h-screen flex flex-col;
            }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="font-sans">
<!-- Header (Modeled after Screen 5) -->
<header class="flex items-center justify-between p-4 sticky top-0 z-10 bg-background-dark/80 backdrop-blur-md border-b border-slate-800/50">
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-100">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-slate-100 uppercase">Add Transaction</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-slate-800 transition-colors"><span class="material-symbols-outlined text-slate-100">info</span></button> <!-- Spacer for symmetry -->
</header>
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<!-- Transaction Type Switcher -->
<div class="px-6 py-6">
<div class="flex h-12 items-center justify-center rounded-xl bg-surface-dark border border-slate-800/50 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 text-slate-500 text-xs font-extrabold uppercase transition-all has-[:checked]:bg-slate-800/80 has-[:checked]:text-primary has-[:checked]:shadow-sm">
<span>Income</span>
<input class="hidden" name="txn-type" type="radio" value="Income"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 text-slate-500 text-xs font-extrabold uppercase transition-all has-[:checked]:bg-slate-800/80 has-[:checked]:text-primary has-[:checked]:shadow-sm">
<span>Expense</span>
<input checked="" class="hidden" name="txn-type" type="radio" value="Expense"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 text-slate-500 text-xs font-extrabold uppercase transition-all has-[:checked]:bg-slate-800/80 has-[:checked]:text-primary has-[:checked]:shadow-sm">
<span>Transfer</span>
<input class="hidden" name="txn-type" type="radio" value="Transfer"/>
</label>
</div>
</div>
<!-- Amount Display (Large/Centered) -->
<div class="flex flex-col items-center justify-center py-8">
<span class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-4">Enter Amount</span>
<div class="flex items-baseline">
<span class="text-3xl font-bold text-primary mr-2">₹</span>
<span class="text-7xl font-extrabold tracking-tight text-white leading-none">0</span>
<div class="w-1.5 h-14 bg-primary ml-2 animate-pulse rounded-full"></div>
</div>
</div>
<!-- Category Section -->
<div class="px-6 mb-10">
<div class="flex justify-between items-center mb-6">
<h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Category</h3>
<button class="text-primary text-xs font-bold uppercase tracking-wider">See all</button>
</div>
<div class="grid grid-cols-4 gap-x-4 gap-y-8">
<!-- Food -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-primary/10 border-2 border-primary/40 flex items-center justify-center text-3xl shadow-[0_0_20px_rgba(0,230,203,0.15)]">
                        🍔
                    </div>
<span class="text-[10px] font-bold text-primary uppercase">Food</span>
</button>
<!-- Transport -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        🚗
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Transport</span>
</button>
<!-- Shopping -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        🛍️
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Shopping</span>
</button>
<!-- Housing -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        🏠
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Housing</span>
</button>
<!-- Health -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        💊
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Health</span>
</button>
<!-- Movies -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        🎬
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Movies</span>
</button>
<!-- Travel -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        ✈️
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Travel</span>
</button>
<!-- Others -->
<button class="flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-full bg-surface-dark border border-slate-800 flex items-center justify-center text-3xl opacity-60">
                        ✨
                    </div>
<span class="text-[10px] font-bold text-slate-500 uppercase">Others</span>
</button>
</div>
</div>
<!-- Date and Time Picker -->
<div class="px-6 mb-6"><h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Date &amp; Time</h3>
<div class="flex gap-3">
<button class="flex-1 flex items-center justify-center gap-3 h-12 px-4 rounded-xl bg-surface-dark border border-slate-800 text-slate-400 hover:bg-slate-800/50 transition-colors">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
<span class="text-xs font-extrabold uppercase tracking-wider text-slate-300">Today</span>
</button>
<button class="flex-1 flex items-center justify-center gap-3 h-12 px-4 rounded-xl bg-surface-dark border border-slate-800 text-slate-400 hover:bg-slate-800/50 transition-colors">
<span class="material-symbols-outlined text-[20px]">schedule</span>
<span class="text-xs font-extrabold uppercase tracking-wider text-slate-300">14:30</span>
</button>
</div></div>
<!-- Wallet/Account Selection -->
<div class="px-6 mb-10">
<h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Payment Method</h3>
<div class="flex items-center gap-3">
<div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-surface-dark border border-slate-800 text-slate-400">
<span class="material-symbols-outlined text-[22px]">account_balance_wallet</span>
</div>
<div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
<button class="whitespace-nowrap rounded-lg px-5 py-2.5 text-xs font-extrabold uppercase tracking-wider bg-primary/10 border-2 border-primary/50 text-primary">Cash</button>
<button class="whitespace-nowrap rounded-lg px-5 py-2.5 text-xs font-extrabold uppercase tracking-wider bg-surface-dark border border-slate-800 text-slate-400">HDFC Card</button>
<button class="whitespace-nowrap rounded-lg px-5 py-2.5 text-xs font-extrabold uppercase tracking-wider bg-surface-dark border border-slate-800 text-slate-400">Savings</button>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action (No Nav Bar) -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent pt-10 z-20">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-black py-5 rounded-xl shadow-2xl shadow-primary/10 transition-all active:scale-[0.98] text-base uppercase tracking-widest flex items-center justify-center gap-3">
<span>Save Transaction</span>
<span class="material-symbols-outlined text-xl">done_all</span>
</button>
</div>
<!-- Decorative Gradients (from Design System) -->
<div class="fixed top-[-5%] right-[-5%] w-72 h-72 bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-[10%] left-[-10%] w-64 h-64 bg-primary/5 blur-[100px] rounded-full pointer-events-none"></div>
</body></html>
