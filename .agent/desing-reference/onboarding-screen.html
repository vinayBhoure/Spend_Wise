<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpendWise Onboarding - Emerald Zenith</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e6cb",
                        "background-dark": "#0a0f1e",
                        "surface": "#161c2d",
                        "destructive": "#FF5A7E"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
            background-color: #0a0f1e;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-dark font-body text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden p-6 safe-area-inset">
<!-- Header with Skip button -->
<header class="flex w-full items-center justify-end pt-4">
<button class="text-slate-500 hover:text-primary transition-colors text-base font-bold tracking-wide">
                Skip
            </button>
</header>
<!-- Main Content Area -->
<main class="flex flex-1 flex-col items-center justify-center">
<!-- Hero Visual: Emerald Zenith Abstract Illustration -->
<div class="relative w-full max-w-sm aspect-square mb-12 flex items-center justify-center">
<!-- Abstract Glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-transparent rounded-full blur-3xl opacity-30"></div>
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Central Geometric Prism -->
<div class="absolute w-52 h-52 border border-primary/20 rounded-2xl rotate-12"></div>
<div class="absolute w-48 h-48 bg-gradient-to-br from-primary/40 via-primary/10 to-transparent rounded-2xl rotate-45 backdrop-blur-md shadow-2xl shadow-primary/20 border border-primary/30"></div>
<!-- Emerald Zenith Core Icon -->
<span class="material-symbols-outlined text-primary text-6xl relative z-10">insights</span>
<!-- High Performance Accents -->
<div class="absolute top-4 right-4 w-3 h-3 bg-primary rounded-full shadow-[0_0_15px_rgba(0,230,203,1)]"></div>
<div class="absolute bottom-6 left-2 w-16 h-1 bg-primary/40 rounded-full blur-[1px]"></div>
</div>
</div>
<!-- Typography Stack: Standardized for Design System -->
<div class="text-center space-y-4 px-4">
<h1 class="text-white text-3xl font-extrabold leading-tight tracking-tight sm:text-4xl">
                    See where your money <span class="text-primary">really</span> goes.
                </h1>
<p class="text-slate-400 text-lg font-medium leading-relaxed max-w-xs mx-auto">
                    Track spending in seconds. No complexity.
                </p>
</div>
</main>
<!-- Footer Actions -->
<footer class="mt-auto pb-10 flex flex-col items-center gap-10 w-full">
<!-- Progress Indicator: Standardized Roundness -->
<div class="flex items-center justify-center gap-3">
<div class="h-1.5 w-8 rounded-full bg-primary shadow-[0_0_12px_rgba(0,230,203,0.5)]"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-700"></div>
<div class="h-1.5 w-1.5 rounded-full bg-slate-700"></div>
</div>
<!-- Primary CTA: Premium Button Style -->
<button class="w-full max-w-sm h-14 bg-primary text-background-dark font-extrabold text-base rounded-xl flex items-center justify-center gap-2 shadow-[0_8px_25px_rgba(0,230,203,0.25)] active:scale-[0.97] transition-all tracking-wide uppercase">
                Get Started
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</footer>
</div>
<!-- Hidden Metadata -->
<div class="hidden">
<img alt="" data-alt="Emerald Zenith financial clarity illustration with dark blue and emerald gradients" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJuFGg52nyUWJ8E84wkG4f_vsdowq8bclUxyHkDxMazm6upmlYuonnwXVGyPwtsSY6_i0D0QvoWSmqPdzMiBFkA5DQt6Q7aXenY01oeUlGgDAwH9kCDrj2sF000_O7UPqa8tzozQqJuM-hiKILYzgdOoIYwwPqVzhBLmLEgH7BH_2uBLPwQbOpZC3tXF4ZLn-lK9Ik81vU6XuHkhXme8vclZzNQTI_VO8Wvg-qIsNJqKG-SmOiegJMwgBPCofkphp6_QenY7jmVst3"/>
</div>
</body></html>
